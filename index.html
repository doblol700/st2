<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Stunt Moto TMA</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #111;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #gameCanvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    /* UI Overlay */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      color: #fff;
      font-weight: 800;
      text-shadow: 0 2px 4px rgba(0,0,0,0.8);
    }
    .score-box {
      font-size: 24px;
    }
    .stunt-label {
      font-size: 16px;
      color: #ffd700;
      height: 20px;
    }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
      margin-bottom: 24px;
      pointer-events: auto;
    }
    .ctrl-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      padding: 18px 0;
      text-align: center;
      active-background: rgba(255, 255, 255, 0.35);
      touch-action: none;
    }
    .btn:active, .btn.active {
      background: rgba(255, 255, 255, 0.4);
      transform: scale(0.97);
    }
    .btn-gas { background: rgba(46, 204, 113, 0.3); border-color: #2ecc71; }
    .btn-brake { background: rgba(231, 76, 60, 0.3); border-color: #e74c3c; }
    
    /* Экран меню / рестарта */
    #overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      pointer-events: auto;
      z-index: 10;
    }
    .bike-selector {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }
    .bike-btn {
      padding: 8px 14px;
      border-radius: 8px;
      border: 1px solid #555;
      background: #222;
      color: #fff;
      font-size: 13px;
      cursor: pointer;
    }
    .bike-btn.selected {
      border-color: #ffd700;
      background: #443400;
      color: #ffd700;
    }
    .start-btn {
      background: #ffd700;
      color: #000;
      font-weight: 800;
      font-size: 18px;
      border: none;
      padding: 14px 40px;
      border-radius: 25px;
      margin-top: 15px;
    }
  </style>
</head>
<body>

  <canvas id="gameCanvas"></canvas>

  <div id="ui-container">
    <div class="hud">
      <div>
        <div class="score-box" id="score">0</div>
        <div class="stunt-label" id="stunt-tag"></div>
      </div>
      <div id="speed" style="font-size: 18px; color: #aaa;">0 KM/H</div>
    </div>

    <div class="controls">
      <div class="ctrl-col">
        <div class="btn" id="btn-lean-back">ВЕС НАЗАД</div>
        <div class="btn btn-brake" id="btn-rear-brake">ЗАДНИЙ ТОРМОЗ</div>
      </div>
      <div class="ctrl-col">
        <div class="btn" id="btn-front-brake">ПЕРЕДНИЙ ТОРМОЗ</div>
        <div class="btn btn-gas" id="btn-gas">ГАЗ</div>
      </div>
    </div>
  </div>

  <div id="overlay-screen">
    <h1 style="font-size: 32px; font-weight: 900; margin-bottom: 5px;">MOTO STUNT 2D</h1>
    <p style="color: #aaa; font-size: 14px;" id="crash-reason">Выбери аппарат для тренировки</p>
    
    <div class="bike-selector">
      <button class="bike-btn selected" onclick="selectBike('scooter')">Скутер 50cc</button>
      <button class="bike-btn" onclick="selectBike('pitbike')">Питбайк 125cc</button>
      <button class="bike-btn" onclick="selectBike('enduro')">Эндуро 250cc</button>
    </div>

    <button class="start-btn" onclick="startGame()">ГАЗОВАТЬ</button>
  </div>

  <script>
    // Инициализация Telegram WebApp
    const tg = window.Telegram?.WebApp;
    if (tg) {
      tg.expand();
      tg.ready();
    }

    const canvas = document.getElementById("gameCanvas");
    const ctx = canvas.getContext("2d");

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // Настройки техники
    const BIKES = {
      scooter: { name: "Scooter 50cc", wheelBase: 65, power: 0.35, liftTorque: 0.042, brakePower: 0.038, weight: 1.0, color: "#00d2d3" },
      pitbike: { name: "Pitbike 125cc", wheelBase: 75, power: 0.45, liftTorque: 0.055, brakePower: 0.045, weight: 1.1, color: "#ff9f43" },
      enduro:  { name: "Enduro 250cc",  wheelBase: 90, power: 0.60, liftTorque: 0.065, brakePower: 0.050, weight: 1.3, color: "#ee5253" }
    };

    let activeBikeKey = "scooter";
    function selectBike(key) {
      activeBikeKey = key;
      document.querySelectorAll(".bike-btn").forEach(b => b.classList.remove("selected"));
      event.target.classList.add("selected");
    }

    // Состояние игры
    let gameState = "MENU"; // MENU, PLAYING, CRASHED
    let score = 0;
    let stuntTimer = 0;
    let currentStunt = "";

    // Ввод
    const input = { gas: false, rearBrake: false, frontBrake: false, leanBack: false };

    function bindTouch(id, prop) {
      const el = document.getElementById(id);
      const start = (e) => { e.preventDefault(); input[prop] = true; el.classList.add("active"); };
      const end = (e) => { e.preventDefault(); input[prop] = false; el.classList.remove("active"); };
      el.addEventListener("touchstart", start);
      el.addEventListener("touchend", end);
      el.addEventListener("mousedown", start);
      el.addEventListener("mouseup", end);
    }
    bindTouch("btn-gas", "gas");
    bindTouch("btn-rear-brake", "rearBrake");
    bindTouch("btn-front-brake", "frontBrake");
    bindTouch("btn-lean-back", "leanBack");

    // Клавиатура для тестирования на ПК
    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyD") input.gas = true;
      if (e.code === "ArrowDown" || e.code === "KeyS") input.rearBrake = true;
      if (e.code === "KeyA") input.frontBrake = true;
      if (e.code === "ArrowLeft") input.leanBack = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyD") input.gas = false;
      if (e.code === "ArrowDown" || e.code === "KeyS") input.rearBrake = false;
      if (e.code === "KeyA") input.frontBrake = false;
      if (e.code === "ArrowLeft") input.leanBack = false;
    });

    // Физическая модель мотоцикла
    let bike = {
      x: 100,
      y: 0,
      vx: 0,
      vy: 0,
      angle: 0, // Угол в радианах
      angularVelocity: 0,
      wheelRadius: 16
    };

    const groundY = () => canvas.height - 180;

    function resetBike() {
      bike.x = 100;
      bike.y = groundY() - 30;
      bike.vx = 0;
      bike.vy = 0;
      bike.angle = 0;
      bike.angularVelocity = 0;
      score = 0;
      currentStunt = "";
    }

    function startGame() {
      resetBike();
      document.getElementById("overlay-screen").style.display = "none";
      gameState = "PLAYING";
    }

    function crash(reason) {
      gameState = "CRASHED";
      if (tg?.HapticFeedback) {
        tg.HapticFeedback.notificationOccurred("error");
      }
      document.getElementById("crash-reason").innerText = reason;
      document.getElementById("overlay-screen").style.display = "flex";
    }

    // Игровой цикл
    function update() {
      if (gameState !== "PLAYING") return;

      const spec = BIKES[activeBikeKey];
      const gravity = 0.35;
      bike.vy += gravity;

      // Силы и крутящий момент
      if (input.gas) {
        bike.vx += spec.power;
        // Газ задирает переднее колесо (вилли)
        bike.angularVelocity += spec.liftTorque;
      }

      if (input.rearBrake) {
        bike.vx *= 0.94;
        // Задний тормоз возвращает байк на колеса
        bike.angularVelocity -= spec.brakePower * 1.5;
      }

      if (input.frontBrake) {
        bike.vx *= 0.88;
        // Передний тормоз вызывает стоппи (наклон вперед)
        if (bike.vx > 1) {
          bike.angularVelocity -= spec.brakePower * 1.8;
        }
      }

      if (input.leanBack) {
        bike.angularVelocity += 0.02;
      }

      // Сопротивление воздуха и трение
      bike.vx *= 0.985;
      bike.angularVelocity *= 0.92;

      // Обновление положения
      bike.x += bike.vx;
      bike.y += bike.vy;
      bike.angle += bike.angularVelocity;

      // Расчет координат колес
      const halfW = spec.wheelBase / 2;
      const cos = Math.cos(bike.angle);
      const sin = Math.sin(bike.angle);

      const rWheelX = bike.x - halfW * cos;
      const rWheelY = bike.y - halfW * sin;

      const fWheelX = bike.x + halfW * cos;
      const fWheelY = bike.y + halfW * sin;

      const floor = groundY();

      // Коллизия заднего колеса с землей
      if (rWheelY >= floor) {
        bike.y = floor + halfW * sin;
        bike.vy = 0;
        if (bike.angle < -0.1) bike.angularVelocity += 0.02; // отскок/выравнивание
      }

      // Коллизия переднего колеса с землей
      if (fWheelY >= floor) {
        bike.y = floor - halfW * sin;
        bike.vy = 0;
        if (bike.angle > 0.1) bike.angularVelocity -= 0.02;
      }

      // Детекция станта и падений
      const deg = (bike.angle * 180) / Math.PI;

      // Опрокидывание назад (переворот)
      if (deg > 85) {
        crash("Перевернулся через заднее крыло!");
        return;
      }
      // Опрокидывание через руль (стоппи краш)
      if (deg < -80) {
        crash("Перелетел через руль!");
        return;
      }

      // Стант: Wheelie (баланс на заднем колесе)
      if (deg > 25 && deg <= 80 && fWheelY < floor - 10) {
        score += Math.floor(deg / 5);
        currentStunt = deg > 65 ? "🔥 12 O'CLOCK SCRAPE!" : "⚡ WHEELIE";
      } 
      // Стант: Stoppie (на переднем колесе)
      else if (deg < -20 && deg >= -75 && rWheelY < floor - 10 && bike.vx > 0.8) {
        score += 8;
        currentStunt = "🎯 STOPPIE / ENDO";
      } else {
        currentStunt = "";
      }

      // Обновление HUD
      document.getElementById("score").innerText = score;
      document.getElementById("stunt-tag").innerText = currentStunt;
      document.getElementById("speed").innerText = `${Math.floor(bike.vx * 10)} KM/H`;
    }

    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      const floor = groundY();
      const spec = BIKES[activeBikeKey];

      // Отрисовка асфальта / разметки с параллаксом
      ctx.fillStyle = "#222";
      ctx.fillRect(0, floor + bike.wheelRadius, canvas.width, canvas.height - floor);
      
      ctx.strokeStyle = "#555";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, floor + bike.wheelRadius);
      ctx.lineTo(canvas.width, floor + bike.wheelRadius);
      ctx.stroke();

      // Отрисовка разметки дороги
      ctx.strokeStyle = "#eee";
      ctx.setLineDash([30, 30]);
      ctx.lineDashOffset = bike.x % 60;
      ctx.beginPath();
      ctx.moveTo(0, floor + 40);
      ctx.lineTo(canvas.width, floor + 40);
      ctx.stroke();
      ctx.setLineDash([]);

      // Центрирование камеры на фиксированной позиции по X
      ctx.save();
      ctx.translate(canvas.width * 0.35, 0);

      // Отрисовка байка и райдера
      ctx.save();
      ctx.translate(0, bike.y);
      ctx.rotate(bike.angle);

      const hw = spec.wheelBase / 2;

      // Колеса
      ctx.fillStyle = "#111";
      ctx.strokeStyle = "#777";
      ctx.lineWidth = 3;
      
      // Заднее колесо
      ctx.beginPath();
      ctx.arc(-hw, 0, bike.wheelRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Переднее колесо
      ctx.beginPath();
      ctx.arc(hw, 0, bike.wheelRadius, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Рама байка
      ctx.strokeStyle = spec.color;
      ctx.lineWidth = 6;
      ctx.lineCap = "round";
      ctx.beginPath();
      ctx.moveTo(-hw, 0);
      ctx.lineTo(0, -15);
      ctx.lineTo(hw, 0);
      ctx.stroke();

      // Вилка и руль
      ctx.strokeStyle = "#aaa";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(hw, 0);
      ctx.lineTo(hw - 10, -35); // руль
      ctx.stroke();

      // Тело райдера (схематично)
      ctx.strokeStyle = "#fff";
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(-5, -20); // таз
      ctx.lineTo(input.leanBack ? -20 : -10, -45); // торс
      ctx.lineTo(hw - 10, -35); // руки к рулю
      ctx.stroke();

      // Голова/шлем
      ctx.fillStyle = "#ffd700";
      ctx.beginPath();
      ctx.arc(input.leanBack ? -22 : -12, -55, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.restore();
      ctx.restore();
    }

    function loop() {
      update();
      render();
      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
