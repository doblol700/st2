<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Realistic Stunt Moto</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <!-- Подключаем легкий физический 2D-движок Matter.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/matter-js/0.19.0/matter.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-user-select: none;
      margin: 0;
      padding: 0;
    }
    body, html {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0f1015;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    /* UI Overlay */
    #ui-container {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 16px;
      z-index: 5;
    }
    .hud {
      display: flex;
      justify-content: space-between;
      color: #fff;
      font-weight: 900;
      text-shadow: 0 2px 6px rgba(0,0,0,0.8);
    }
    .score-box { font-size: 26px; }
    .stunt-label { font-size: 16px; color: #f1c40f; height: 22px; }
    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      margin-bottom: 24px;
      pointer-events: auto;
    }
    .ctrl-col {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .btn {
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.25);
      border-radius: 14px;
      color: #fff;
      font-size: 15px;
      font-weight: 800;
      padding: 18px 0;
      text-align: center;
      touch-action: none;
    }
    .btn:active, .btn.active {
      transform: scale(0.96);
      background: rgba(255, 255, 255, 0.3);
    }
    .btn-gas { background: rgba(46, 204, 113, 0.3); border-color: #2ecc71; }
    .btn-rear-brake { background: rgba(231, 76, 60, 0.3); border-color: #e74c3c; }
    .btn-front-brake { background: rgba(230, 126, 34, 0.3); border-color: #e67e22; }

    #overlay-screen {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.88);
      display: none;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #fff;
      pointer-events: auto;
      z-index: 10;
    }
    .restart-btn {
      background: #f1c40f;
      color: #000;
      font-weight: 900;
      font-size: 18px;
      border: none;
      padding: 14px 44px;
      border-radius: 30px;
      margin-top: 20px;
      cursor: pointer;
    }
  </style>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="ui-container">
    <div class="hud">
      <div>
        <div class="score-box" id="score">0</div>
        <div class="stunt-label" id="stunt-tag"></div>
      </div>
      <div id="speed" style="font-size: 18px; color: #aaa;">0 KM/H</div>
    </div>

    <div class="controls">
      <div class="ctrl-col">
        <div class="btn" id="btn-lean-back">ВЕС НАЗАД</div>
        <div class="btn btn-rear-brake" id="btn-rear-brake">ЗАДНИЙ ТОРМОЗ</div>
      </div>
      <div class="ctrl-col">
        <div class="btn btn-front-brake" id="btn-front-brake">ПЕРЕДНИЙ ТОРМОЗ</div>
        <div class="btn btn-gas" id="btn-gas">ГАЗ</div>
      </div>
    </div>
  </div>

  <div id="overlay-screen">
    <h1 style="font-size: 32px; font-weight: 900; margin-bottom: 8px;">💥 КРАШ!</h1>
    <p style="color: #bbb; font-size: 15px;" id="crash-reason">Ты перевернулся</p>
    <button class="restart-btn" onclick="restartGame()">ЕЩЁ РАЗ</button>
  </div>

  <script>
    const tg = window.Telegram?.WebApp;
    if (tg) { tg.expand(); tg.ready(); }

    const { Engine, Render, Runner, Bodies, Composite, Constraint, Body, Events, Vector } = Matter;

    const engine = Engine.create();
    const world = engine.world;

    const container = document.getElementById("canvas-container");
    const render = Render.create({
      element: container,
      engine: engine,
      options: {
        width: window.innerWidth,
        height: window.innerHeight,
        wireframes: false,
        background: "#12131a"
      }
    });

    Render.run(render);
    const runner = Runner.create();
    Runner.run(runner, engine);

    // Управление
    const input = { gas: false, rearBrake: false, frontBrake: false, leanBack: false };

    function bind(id, prop) {
      const el = document.getElementById(id);
      const on = (e) => { e.preventDefault(); input[prop] = true; el.classList.add("active"); };
      const off = (e) => { e.preventDefault(); input[prop] = false; el.classList.remove("active"); };
      el.addEventListener("touchstart", on);
      el.addEventListener("touchend", off);
      el.addEventListener("mousedown", on);
      el.addEventListener("mouseup", off);
    }
    bind("btn-gas", "gas");
    bind("btn-rear-brake", "rearBrake");
    bind("btn-front-brake", "frontBrake");
    bind("btn-lean-back", "leanBack");

    // Клавиши для ПК тестов
    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyD") input.gas = true;
      if (e.code === "ArrowDown" || e.code === "KeyS") input.rearBrake = true;
      if (e.code === "KeyA") input.frontBrake = true;
      if (e.code === "ArrowLeft") input.leanBack = true;
    });
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowUp" || e.code === "KeyD") input.gas = false;
      if (e.code === "ArrowDown" || e.code === "KeyS") input.rearBrake = false;
      if (e.code === "KeyA") input.frontBrake = false;
      if (e.code === "ArrowLeft") input.leanBack = false;
    });

    // Создание рельефа трассы
    function createTerrain() {
      const segments = [];
      const baseY = window.innerHeight * 0.75;
      let currX = 0;
      let currY = baseY;

      for (let i = 0; i < 40; i++) {
        let width = 200 + Math.random() * 80;
        let angle = 0;

        // Делаем кочки и трамплины через каждые несколько сегментов
        if (i > 3 && i % 4 === 0) angle = -0.15; // трамплин вверх
        else if (i > 3 && (i - 1) % 4 === 0) angle = 0.15; // спуск

        const nextX = currX + Math.cos(angle) * width;
        const nextY = currY + Math.sin(angle) * width;

        const midX = (currX + nextX) / 2;
        const midY = (currY + nextY) / 2;

        const ground = Bodies.rectangle(midX, midY + 25, width, 50, {
          isStatic: true,
          angle: angle,
          friction: 0.95,
          render: { fillStyle: "#1e222d" }
        });

        segments.push(ground);
        currX = nextX;
        currY = nextY;
      }
      Composite.add(world, segments);
    }
    createTerrain();

    // Создание мотоцикла с РЕАЛЬНОЙ подвеской
    let bikeBody, rearWheel, frontWheel, rearSuspension, frontSuspension;
    let isCrashed = false;
    let score = 0;

    function buildMotorcycle(x, y) {
      const group = Body.nextGroup(true); // чтобы колеса и рама не сталкивались друг с другом

      // Рама байка
      bikeBody = Bodies.rectangle(x, y, 70, 20, {
        collisionFilter: { group: group },
        density: 0.003,
        render: { fillStyle: "#e74c3c" }
      });

      // Колеса
      const wheelOptions = {
        collisionFilter: { group: group },
        friction: 0.98,
        density: 0.002,
        render: { fillStyle: "#2c3e50" }
      };
      rearWheel = Bodies.circle(x - 40, y + 25, 20, wheelOptions);
      frontWheel = Bodies.circle(x + 40, y + 25, 20, wheelOptions);

      // Задняя подвеска (пружина-амортизатор)
      rearSuspension = Constraint.create({
        bodyA: bikeBody,
        pointA: { x: -35, y: 10 },
        bodyB: rearWheel,
        stiffness: 0.18,   // мягкость хода подвески
        damping: 0.08,     // гашение ударов
        length: 22,
        render: { strokeStyle: "#7f8c8d", lineWidth: 5 }
      });

      // Передняя подвеска (вилка)
      frontSuspension = Constraint.create({
        bodyA: bikeBody,
        pointA: { x: 35, y: 10 },
        bodyB: frontWheel,
        stiffness: 0.22,
        damping: 0.09,
        length: 22,
        render: { strokeStyle: "#bdc3c7", lineWidth: 5 }
      });

      // Дополнительные соединители геометрии, чтобы рама держала баланс оси
      const rearAxle = Constraint.create({
        bodyA: bikeBody,
        pointA: { x: -10, y: 10 },
        bodyB: rearWheel,
        stiffness: 0.2,
        damping: 0.08,
        length: 35,
        render: { visible: false }
      });
      const frontAxle = Constraint.create({
        bodyA: bikeBody,
        pointA: { x: 10, y: 10 },
        bodyB: frontWheel,
        stiffness: 0.2,
        damping: 0.08,
        length: 35,
        render: { visible: false }
      });

      Composite.add(world, [bikeBody, rearWheel, frontWheel, rearSuspension, frontSuspension, rearAxle, frontAxle]);
    }

    buildMotorcycle(150, window.innerHeight * 0.65);

    function triggerCrash(reason) {
      if (isCrashed) return;
      isCrashed = true;
      if (tg?.HapticFeedback) tg.HapticFeedback.notificationOccurred("error");
      document.getElementById("crash-reason").innerText = reason;
      document.getElementById("overlay-screen").style.display = "flex";
    }

    window.restartGame = function() {
      // Очистка и пересоздание
      const allBodies = Composite.allBodies(world);
      const allConstraints = Composite.allConstraints(world);
      allBodies.forEach(b => !b.isStatic && Composite.remove(world, b));
      allConstraints.forEach(c => Composite.remove(world, c));

      isCrashed = false;
      score = 0;
      document.getElementById("overlay-screen").style.display = "none";
      buildMotorcycle(150, window.innerHeight * 0.65);
    };

    // Главный цикл обновлений
    Events.on(engine, "beforeUpdate", () => {
      if (isCrashed) return;

      // 1. Газ (крутит заднее колесо + задирает раму вверх для Вилли)
      if (input.gas) {
        rearWheel.torque = 0.06;
        bikeBody.torque = 0.045; // крутящий момент на подъем переда
      }

      // 2. Задний тормоз (блокирует заднее колесо, сбивает угол вилли)
      if (input.rearBrake) {
        Body.setAngularVelocity(rearWheel, rearWheel.angularVelocity * 0.7);
        bikeBody.torque = -0.06; // прижимает переднее колесо к земле
      }

      // 3. Передний тормоз (выход в Стоппи)
      if (input.frontBrake) {
        Body.setAngularVelocity(frontWheel, frontWheel.angularVelocity * 0.5);
        if (bikeBody.velocity.x > 2) {
          bikeBody.torque = -0.065; // задирает заднее колесо
        }
      }

      // 4. Вес назад
      if (input.leanBack) {
        bikeBody.torque = 0.05;
      }

      // Камера следит за байком
      Render.lookAt(render, bikeBody, {
        x: window.innerWidth * 0.35,
        y: window.innerHeight * 0.35
      });

      // Логика стантов и падений
      const deg = (bikeBody.angle * 180) / Math.PI;

      if (deg > 85) triggerCrash("Переворот назад!");
      if (deg < -80) triggerCrash("Перелёт через руль!");

      let stuntText = "";
      // Wheelie: наклон назад, заднее колесо крутится
      if (deg > 20 && deg <= 80) {
        score += Math.floor(deg / 4);
        stuntText = deg > 60 ? "🔥 12 O'CLOCK SCRAPE!" : "⚡ WHEELIE";
      }
      // Stoppie: наклон вперед на ходу
      else if (deg < -15 && deg >= -75 && bikeBody.velocity.x > 1.5) {
        score += 8;
        stuntText = "🎯 STOPPIE";
      }

      document.getElementById("score").innerText = score;
      document.getElementById("stunt-tag").innerText = stuntText;
      document.getElementById("speed").innerText = `${Math.floor(bikeBody.velocity.x * 9)} KM/H`;
    });
  </script>
</body>
</html>
